name: Promote packages and publish registry

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "runtimes/**"
      - "assets/**"
      - "*.schema.json"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: registry-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install registry dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Select promotion base
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          force_all=false
          if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD)"
            force_all=true
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "${BEFORE}" HEAD; then
            base_sha="${BEFORE}"
          else
            # A force-push or amended commit can leave event.before missing or
            # outside the new history. A full backfill avoids skipping releases
            # from commits that are no longer reachable from this checkout.
            base_sha="$(git rev-parse HEAD)"
            force_all=true
            echo "event.before ${BEFORE} is unavailable or not an ancestor; promoting all published assets" >&2
          fi
          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "force_all=${force_all}" >> "${GITHUB_OUTPUT}"

      - name: Validate canonical registry
        run: python scripts/validate_registry.py --root .

      - name: Promote reviewed Debian assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            --root .
            --base-ref "${{ steps.base.outputs.sha }}"
            --head-ref "${{ github.sha }}"
            --repository "${{ github.repository }}"
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.base.outputs.force_all }}" == "true" ]]; then
            args+=(--all-published)
          fi
          python scripts/promote_release.py "${args[@]}"

      - name: Build immutable registry snapshot
        run: >-
          python scripts/build_pages.py
          --root .
          --output public
          --snapshot-id "${{ github.sha }}"
          --base-url "https://${{ github.repository_owner }}.github.io/packages"

      - name: Prepare APT signing
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          if [[ -n "${APT_GPG_PRIVATE_KEY}" ]]; then
            export GNUPGHOME="${RUNNER_TEMP}/apt-gnupg"
            mkdir -m 700 -p "${GNUPGHOME}"
            printf '%s\n' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
            key_id="${APT_GPG_KEY_ID}"
            if [[ -z "${key_id}" ]]; then
              key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
            fi
            if [[ -z "${key_id}" ]]; then
              echo "APT_GPG_KEY_ID or a usable secret key is required" >&2
              exit 1
            fi
            echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"
            echo "APT_GPG_KEY_ID=${key_id}" >> "${GITHUB_ENV}"
          else
            echo "APT_GPG_PRIVATE_KEY is required to publish the signed APT repository" >&2
            exit 1
          fi

      - name: Build standard APT repository
        run: |
          generated_at="$(git show -s --format=%cI "${{ github.sha }}")"
          python scripts/build_apt.py \
            --root . \
            --output public \
            --generated-at "${generated_at}" \
            --signing-key "${APT_GPG_KEY_ID}"

      - name: Publish APT public key
        run: |
          gpg --batch --export "${APT_GPG_KEY_ID}" > public/apt-keyring.gpg

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
