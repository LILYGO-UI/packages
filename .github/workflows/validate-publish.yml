name: Validate registry submission

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate data
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate

      - name: Fetch authoritative base revision
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: git fetch "https://github.com/${BASE_REPOSITORY}.git" "${BASE_SHA}"

      - name: Check out trusted validator
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: validator

      - name: Install validator dependencies
        run: python -m pip install --requirement validator/requirements.txt

      - name: Validate metadata, ownership, assets, and Debian package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >-
          python validator/scripts/validate_registry.py
          --root candidate
          --schema-root validator
          --base-ref "${BASE_SHA}"
          --pr-author "${PR_AUTHOR}"
          --fetch-artifacts
